[project]
name = "unigear"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "flask",
    "flask-wtf",
    "python-dotenv",
    "wtforms",
    "cloudinary",
    "google-auth",
    "google-auth-oauthlib",
    "psycopg[binary]",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "instance",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "B008",  # do not perform function calls in argument defaults
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["app", "config"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.vercel]
entrypoint = "run:app"
