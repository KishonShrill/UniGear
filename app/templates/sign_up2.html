<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniGear Registration</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body, html {
      height: 100%;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f0f0f0;
    }

    .container {
      width: 100vw;
      height: 100vh;
      display: flex;
      position: relative;
    }

    .background-image {
      position: absolute;
      inset: 0;
      background: url("{{ url_for('static', filename='images/Landingpage.jpg') }}") center center/cover no-repeat;
      z-index: 1;
      filter: brightness(0.7);
    }

    .left-section {
      width: 40%;
      background-color: rgba(255, 255, 255, 0.85);
      padding: 80px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
      z-index: 1;
    }

    .left-section h1 {
      font-size: 40px;
      font-weight: 600;
      margin-bottom: 40px;
      color: #000;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .form-group input {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    .form-group input[type="submit"] {
      background-color: black;
      color: white;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background-color 0.3s ease;
    }

    .form-group input[type="submit"]:hover {
      background-color: #333;
    }

    .signup-link {
      margin-top: 20px;
      font-size: 14px;
      color: #000;
      width: 100%;
      text-align: center;
    }

    .signup-link a {
      color: #3ba74d;
      text-decoration: none;
      font-weight: 600;
    }

    .signup-link a:hover {
      text-decoration: underline;
    }

    .right-section {
      width: 60%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
      z-index: 1;
    }

    .right-overlay {
      position: relative;
      z-index: 1;
    }

    .right-overlay h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 250px;
      font-weight: 400;
      line-height: 200px;
      letter-spacing: -5px;
      text-align: left;
      color: white;
      padding-top: 240px;
      margin-bottom: -10px;
    }

    .right-overlay p {
      font-family: 'Inter', sans-serif;
      font-size: 30px;
      font-weight: 300;
      line-height: 1;
      text-align: right;
      color: white;
      padding-top: 0;
      margin-top: 0;
    }

    @media (max-width: 768px) {
      .left-section, .right-section {
        width: 100%;
        padding: 20px;
      }

      .right-overlay h2 {
        font-size: 120px;
      }

      .right-overlay p {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="background-image"></div>
    
    <div class="left-section">
      <h1 style="white-space: nowrap;">Create your account</h1> 
      <form id="register-form" method="POST" action="{{ url_for('auth.sign_up') }}">
        <div class="form-group">
          <label for="city">City</label>
          <input type="text" id="city" name="city" placeholder="Enter your city" required>
        </div>

        <div class="form-group">
          <label for="barangay">Barangay</label>
          <input type="text" id="barangay" name="barangay" placeholder="Enter your barangay" required>
        </div>

        <div class="form-group">
          <label for="address">Zip Code/Street Address</label>
          <input type="text" id="address" name="address" placeholder="Enter your zip code/street address" required>
        </div>

        <div class="form-group">
          <label for="contact">Contact No.</label>
          <input type="tel" id="contact" name="contact" placeholder="Enter your contact number" required>
        </div>

        <div class="form-group">
          <input name="submit" type="submit" value="Sign Up">
        </div>
      </form>

      <div class="signup-link">
        Already have an account? <a href="{{ url_for('auth.sign_in') }}">Log In</a>
      </div>
    </div>

    <div class="right-section">
      <div class="right-overlay">
        <h2>UNIGEAR</h2>
        <p>Wear your college legacy with pride</p>
      </div>
    </div>
  </div>
</body>
</html>
